<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GutSense Demo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030A14;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,'Helvetica Neue',sans-serif}
.gs{background:#060E1C;width:420px;min-height:700px;border-radius:20px;overflow:hidden;border:1px solid #1B3050;display:flex;flex-direction:column}
.gs-nav{background:#060E1C;border-bottom:1px solid #1B3050;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;height:48px;flex-shrink:0}
.gs-logo{font-size:17px;font-weight:500;color:#E2EDF7}
.gs-dots{display:flex;gap:5px;align-items:center}
.gs-dot{height:6px;border-radius:3px;cursor:pointer;transition:all .3s;background:#1B3050;width:6px;display:inline-block}
.gs-dot.on{background:#00CCDE;width:18px}
.gs-content{flex:1;overflow-y:auto}
.gs-scr{padding:1.5rem 1.5rem 1rem;max-width:420px;margin:0 auto}
.gs-footer{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.25rem;border-top:1px solid #1B3050;flex-shrink:0}
.card{background:#0C1829;border:1px solid #1B3050;border-radius:12px;padding:1rem}
.card2{background:#10203A;border:1px solid #1B3050;border-radius:12px;padding:1rem}
.btn-p{width:100%;padding:13px;background:#00CCDE;border:none;border-radius:10px;color:#060E1C;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-p.danger{background:#EF4444;color:#E2EDF7}
.btn-g{background:transparent;border:1px solid #1B3050;color:#6B8299;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px}
.btn-g.next{color:#00CCDE;border-color:#00CCDE}
.chip{padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;border:1.5px solid #1B3050;background:#0C1829;color:#6B8299;transition:all .15s;display:inline-block;margin:0 6px 6px 0}
.chip.b{background:#2D0808;border-color:#EF4444;color:#EF4444}
.chip.g{background:#051A1C;border-color:#00CCDE;color:#00CCDE}
.bar-w{margin-bottom:10px}
.bar-l{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:#E2EDF7}
.bar-t{height:5px;background:#1B3050;border-radius:3px;overflow:hidden}
.bar-f{height:100%;border-radius:3px;transition:width .5s}
.qcard{background:#0C1829;border:1.5px solid #1B3050;border-radius:12px;padding:1rem;margin-bottom:10px;cursor:pointer;transition:all .2s}
.qcard.done{background:#10203A}
.fade{animation:fd .2s ease}
@keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
img.cover{width:100%;border-radius:10px;display:block;object-fit:cover}
.zone-detail{background:#10203A;border-radius:12px;padding:1rem;margin-bottom:1rem;animation:fd .2s ease}
</style>
</head>
<body>
<div class="gs">
  <nav class="gs-nav">
    <div class="gs-logo">GutSense<span style="color:#00CCDE">.</span></div>
    <div class="gs-dots" id="dots"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="stitle" style="font-size:11px;color:#6B8299">인트로</div>
      <button id="homeBtn" onclick="GS.home()" title="대시보드로 가기" style="background:#0C1829;border:1px solid #1B3050;color:#6B8299;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center">🏠</button>
    </div>
  </nav>
  <div class="gs-content"><div id="content"></div></div>
  <div class="gs-footer">
    <button class="btn-g" id="prevBtn" onclick="GS.go(-1)">← 이전</button>
    <span id="pnum" style="font-size:11px;color:#6B8299">1 / 7</span>
    <button class="btn-g next" id="nextBtn" onclick="GS.go(1)">다음 →</button>
  </div>
</div>

function calcSt(sel){
  let s=72,l=25,i=19;
  sel.forEach(f=>{
    if(f.id==='snack'){s-=20;l+=24;i+=18;}if(f.id==='noodle'){s-=14;l+=16;i+=13;}
    if(f.id==='yogurt'){s+=10;l-=6;i-=7;}if(f.id==='steak'){s-=5;l+=6;i+=5;}
  });
  return{scfa:Math.max(4,Math.min(94,s)),lps:Math.max(4,Math.min(94,l)),inf:Math.max(4,Math.min(94,i))};
}
function barH(label,val,good){
  const col=good?(val>60?C.green:val>35?C.yellow:C.red):(val<40?C.green:val<65?C.yellow:C.red);
  return`<div class="bar-w"><div class="bar-l"><span style="color:${C.sub}">${label}</span><span style="color:${col};font-weight:500">${val}</span></div><div class="bar-t"><div class="bar-f" style="width:${val}%;background:${col}"></div></div></div>`;
}
function tubeSVG(bc){
  const cut=4+bc*3;let c='';
  BP.forEach(([x,y],i)=>{const bad=i<cut,col=bad?C.red:C.green;let sp='';
    if(bad)[0,60,120,180,240,300].forEach(a=>{sp+=`<line x1="${x}" y1="${y}" x2="${x+Math.cos(a*Math.PI/180)*9}" y2="${y+Math.sin(a*Math.PI/180)*9}" stroke="${C.red}" stroke-width=".8" opacity=".5"/>"`;});
    c+=`<g>${sp}<circle cx="${x}" cy="${y}" r="${bad?6:5}" fill="${col}" opacity=".9"/></g>`;
  });
  return`<svg width="100%" viewBox="0 0 320 100" style="display:block"><ellipse cx="160" cy="50" rx="130" ry="38" fill="${C.card2}" stroke="${C.cyan}" stroke-width="1.5"/>${c}</svg>`;
}
function mapSVG(az){
  const xs=ZONES.map((_,i)=>30+(i/4)*280),ys=ZONES.map((_,i)=>i%2===0?45:85);
  let lines='',nodes='';
  ZONES.forEach((_,i)=>{if(i<4)lines+=`<line x1="${xs[i]}" y1="${ys[i]}" x2="${xs[i+1]}" y2="${ys[i+1]}" stroke="${C.line}" stroke-width="1.5" stroke-dasharray="5,4"/>"`;});
  ZONES.forEach((z,i)=>{
    const x=xs[i],y=ys[i],sel=az===z.id,r=sel?22:18;
    nodes+=`<g onclick="GS.zone('${z.id}')" style="cursor:pointer">
      ${z.id==='D'?`<circle cx="${x}" cy="${y}" r="27" fill="none" stroke="${C.red}" stroke-width=".8" stroke-dasharray="3,3" opacity=".6"/>`:''}"
      <circle cx="${x}" cy="${y}" r="${r}" fill="${C.card}" stroke="${z.color}" stroke-width="${sel?2:1.5}"/>
      <text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" fill="${z.color}" font-size="11" font-weight="500">${z.id}</text>
      <text x="${x}" y="${y+(sel?32:29)}" text-anchor="middle" fill="${C.sub}" font-size="8">${z.eng}</text>
      <text x="${x}" y="${y+(sel?42:39)}" text-anchor="middle" fill="${z.color}" font-size="9" font-weight="500">${z.score}</text>
      ${z.id==='D'?`<text x="${x+14}" y="${y-16}" fill="${C.red}" font-size="10">!</text>`:''}
    </g>`;
  });
  return`<svg width="100%" viewBox="0 0 340 130">${lines}${nodes}</svg>`;
}

        <div style="font-size:11px;color:#6B8299;margin-bottom:12px;font-weight:500">장 건강 지표</div>
        ${barH('SCFA 지수 (장벽 에너지)',st.scfa,true)}${barH('내독소 LPS 지수',st.lps,false)}${barH('염증 반응 지수',st.inf,false)}
      </div>
      <div class="card2" style="font-size:11px;color:#80C8DD;line-height:1.7;margin-bottom:1rem">
        📖RAG · ${rag}
      </div>
      <button class="btn-p${alert?' danger':''}" onclick="GS.goTo(${alert?4:5})">
        ${alert?'⚠️ 장 이상 감지 — 내시경 확인':'AI 내시경 보기'} →
      </button>
    </div>`;
  },

  reaction:()=>{
    const src=selFoods.length?selFoods:[FOODS[0],FOODS[2]],st=calcSt(src);
    return`<div class="gs-scr">
      <div style="font-size:11px;color:#EF4444;font-weight:500;margin-bottom:6px">⚠️Zone D · 긴급 경보</div>
      <div style="font-size:16px;font-weight:500;color:#E2EDF7;margin-bottom:4px">장 생태계 이상 감지</div>
      <div style="font-size:12px;color:#6B8299;margin-bottom:1.25rem">저당과자 + 국수 조합이 소장 융모를 손상시킵니다</div>
      <div class="card" style="border-color:#EF4444;margin-bottom:1rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-size:13px;color:#EF4444;font-weight:500">저당과자 + 국수</div>
          <div style="text-align:right"><div style="font-size:11px;color:#6B8299">장 건강 점수</div>
          <div style="font-size:28px;font-weight:500;color:#EF4444">34<span style="font-size:13px;color:#6B8299">/100</span></div></div>
        </div>
        <div style="font-size:12px;color:#6B8299;line-height:1.8">수크랄로스 + 정제 탄수화물 → SCFA 급감 → 소장 융모 손상 → 영양 흡수 저하</div>
      </div>
      <img src="${IMGS.bact}" class="cover" style="margin-bottom:1rem"/>
      <div class="card" style="margin-bottom:1rem">
        ${barH('SCFA 지수 (장벽 에너지)',st.scfa,true)}${barH('내독소 LPS 지수',st.lps,false)}${barH('염증 반응 지수',st.inf,false)}
      </div>
      <button class="btn-p" onclick="GS.goTo(5)">AI 내시경으로 확인하기 →</button>
    </div>`;
  },

  endoscope:()=>`<div class="gs-scr">
    <div style="font-size:16px;font-weight:500;color:#E2EDF7;margin-bottom:4px">AI 내시경 시뮬레이션</div>
    <div style="font-size:12px;color:#6B8299;margin-bottom:1.25rem">현재 식습관 기반 — 현재 · 5년 후 악화 · 개선 시 비교</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.25rem">
      ${[
        {img:'scope_now',label:'NOW · 현재',badge:'정상 점막 · 양호',score:85,col:C.green},
        {img:'scope_bad',label:'+5Y · 악화',badge:'용종 · 만성염증',score:23,col:C.red},
        {img:'scope_rec',label:'+5Y · 회복',badge:'균총 회복 · 정상화',score:81,col:C.cyan},
      ].map(v=>`
        <div class="card" style="padding:0;overflow:hidden">
          <img src="${IMGS[v.img]}" style="width:100%;aspect-ratio:1;object-fit:cover;display:block"/>
          <div style="padding:8px 10px">
            <div style="font-size:9px;color:#6B8299;margin-bottom:2px">${v.label}</div>
            <div style="font-size:10px;color:#E2EDF7;line-height:1.4;margin-bottom:4px">${v.badge}</div>
            <div style="font-size:20px;font-weight:500;color:${v.col}">${v.score}<span style="font-size:10px;color:#6B8299">/100</span></div>
          </div>
        </div>`).join('')}
    </div>
    <div class="card" style="margin-bottom:1rem">
      ${[['01','장 맵에서 부위 클릭','대장 위험 지점 클릭'],['02','AI 내시경 뷰 생성','Diffusion 모델 — 식습관 기반'],['03','5년 후 예측 컷','악화 시나리오 — 염증·용종'],['04','개선 시나리오 비교','권장 습관 적용 시 회복']].map(([n,t,d])=>`
        <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">
          <div style="min-width:22px;height:22px;border-radius:6px;background:#10203A;border:1px solid #1B3050;display:flex;align-items:center;justify-content:center;font-size:10px;color:#00CCDE;flex-shrink:0">${n}</div>
          <div><div style="font-size:12px;font-weight:500;color:#E2EDF7;margin-bottom:1px">${t}</div><div style="font-size:11px;color:#6B8299">${d}</div></div>
        </div>`).join('')}
    </div>
    <div class="card2" style="font-size:11px;color:#6B8299;line-height:1.7;margin-bottom:1rem">AI 라벨 — 의료 참고용 아님. Diffusion 모델이 식습관 데이터를 시드로 생성한 시뮬레이션입니다.</div>
    <button class="btn-p" onclick="GS.goTo(6)">퀘스트로 장 회복하기 →</button>
  </div>`,

  quest:()=>{
    const qs=[
      {id:'q1',icon:'🚫',title:'제로음료 끊기',cond:'7일 연속',reward:'회복 포션 ×1',zone:'십이지장',color:C.red},
      {id:'q2',icon:'🌿',title:'식이섬유 챌린지',cond:'25g/일 × 5일',reward:'유익균 강화 아이템',zone:'상행결장',color:C.green},
      {id:'q3',icon:'💧',title:'공복 수분',cond:'아침 물 500ml × 5일',reward:'소장 운동성 부스터',zone:'회장',color:C.cyan},
    ];
    const pct=Math.round((questDone.length/qs.length)*100);
    return`<div class="gs-scr">
      <div style="font-size:16px;font-weight:500;color:#E2EDF7;margin-bottom:4px">퀘스트 & 리워드</div>
      <div style="font-size:12px;color:#6B8299;margin-bottom:1.25rem">행동 변화가 장 맵을 회복시킨다</div>
      ${qs.map(q=>{const d=questDone.includes(q.id);return`
        <div class="qcard${d?' done':''}" style="border-color:${d?q.color:'#1B3050'}" onclick="GS.quest('${q.id}')">
          <div style="display:flex;gap:12px;align-items:center">
            
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;margin-bottom:3px">
                <div style="font-size:14px;font-weight:500;color:${d?q.color:'#E2EDF7'}">${q.title}</div>
                <div style="font-size:10px;color:#6B8299">${q.cond}</div>
              </div>
              <div style="font-size:11px;color:#6B8299;margin-bottom:4px">🎁${q.reward}</div>
              <div style="font-size:11px;color:${q.color}">장 변화 · ${q.zone} 회복 이펙트</div>
            </div>
            <div style="width:22px;height:22px;border-radius:50%;border:1.5px solid ${d?q.color:'#1B3050'};background:${d?q.color:'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
              ${d?'✓':''}
            </div>
          </div>
        </div>`;}).join('')}
      <div class="card" style="margin-bottom:1rem;margin-top:4px">
        <div style="font-size:11px;color:#6B8299;margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em">리워드 → 삼성생명 연동</div>
        <div style="display:flex;align-items:center;gap:4px">
          ${[['퀘스트\n완수','#00CCDE'],['포인트\n적립','#22C55E'],['보험료\n할인','#F59E0B'],['건강검진\n할인권','#F97316']].map(([l,c],i,a)=>`
            <div style="display:flex;align-items:center;gap:4px;flex:1">
              <div style="flex:1;background:#10203A;border:1px solid #1B3050;border-radius:8px;padding:8px 4px;text-align:center">
                <div style="font-size:9px;color:${c};font-weight:500;white-space:pre-wrap;line-height:1.4">${l}</div>
              </div>
              ${i<a.length-1?'':''}
            </div>`).join('')}
        </div>
      </div>
      <div class="card" style="margin-bottom:1.5rem">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:13px;font-weight:500;color:#00CCDE">이번 주 달성률</div>
          <div style="font-size:13px;font-weight:500;color:#00CCDE">${questDone.length}/${qs.length}</div>
        </div>
        <div style="height:4px;background:#1B3050;border-radius:2px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:#00CCDE;border-radius:2px;transition:width .4s"></div>
        </div>
      </div>
      <div class="card2" style="text-align:center;padding:1.25rem">
        <div style="font-size:18px;font-weight:500;color:#E2EDF7;margin-bottom:6px">GutSense<span style="color:#00CCDE">.</span></div>
        <div style="font-size:12px;color:#6B8299;line-height:1.8;margin-bottom:6px">"보험을 넘어서는 보험 — 질병 발생 전 장에서 시작한다"</div>
        <div style="font-size:11px;color:#6B8299">삼성생명 라이프놀로지 랩 3기 · 연세대학교 · Team 3</div>
      </div>
    </div>`;
  },
};

function render(){
  document.getElementById('dots').innerHTML=SCREENS.map((s,i)=>`<div class="gs-dot${i===cur?' on':''}" onclick="GS.goTo(${i})"></div>`).join('');
  document.getElementById('stitle').textContent=STITLE[cur];
  document.getElementById('content').innerHTML=SCRS[SCREENS[cur]]();
  document.getElementById('pnum').textContent=`${cur+1} / ${SCREENS.length}`;
  document.getElementById('prevBtn').style.opacity=cur===0?.3:1;
  document.getElementById('nextBtn').style.opacity=cur===SCREENS.length-1?.3:1;
  const hb=document.getElementById('homeBtn');
  hb.style.opacity=cur===0?.3:1;
  hb.style.cursor=cur===0?'default':'pointer';
  document.getElementById('gs-content')&&(document.getElementById('gs-content').scrollTop=0);
  document.querySelector('.gs-content').scrollTop=0;
}

window.GS={
  goTo:i=>{cur=Math.max(0,Math.min(SCREENS.length-1,i));render();},
  go:d=>{window.GS.goTo(cur+d);},
  home:()=>{window.GS.goTo(0);},
  zone:id=>{activeZone=activeZone===id?null:id;render();},
  food:id=>{const f=FOODS.find(x=>x.id===id);const i=selFoods.findIndex(x=>x.id===id);if(i>=0)selFoods.splice(i,1);else selFoods.push(f);render();},
  quest:id=>{const i=questDone.indexOf(id);if(i>=0)questDone.splice(i,1);else questDone.push(id);render();},
};

render();
</script>
</body>
</html>
